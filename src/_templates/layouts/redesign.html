<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>{{ title }}</title>
		<meta
			name="description"
			content="{% if description %}{{ description }}{% else %}{{ site.description }}{% endif %}"
		/>
		<link rel="icon" href="/assets/favicon/favicon-32x32.png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" />
		<link rel="preconnect" href="https://api.fonts.coollabs.io" />
		<link rel="preconnect" href="https://use.typekit.net" crossorigin />
		<link
			rel="stylesheet"
			href="https://api.fonts.coollabs.io/css2?family=Source+Sans+3:ital,wght@0,400..700;1,400..700&display=swap"
		/>
		<link rel="stylesheet" href="https://use.typekit.net/fup4xhh.css" />
		<link rel="stylesheet" href="/assets/css/redesign.css" />
	</head>
	<body>
		<a class="skip" href="#main">Skip to main content</a>
		<header class="site-header">
			<div class="container site-header__inner">
				<a class="site-header__logo" href="/redesign/">
					<img
						src="/img/Logos/SVG/Color Logo Black.svg"
						alt="Tiny Pond home"
						width="120"
						height="40"
					/>
				</a>
				<nav aria-label="Main">
					<ul class="site-nav">
						<li><a href="/redesign/#work">Work</a></li>
						<li><a href="/redesign/#services">Services</a></li>
						<li><a href="/redesign/#about">About</a></li>
						<li>
							<a class="btn btn--primary btn--small" href="/redesign/#contact"
								>Start a project</a
							>
						</li>
					</ul>
				</nav>
			</div>
		</header>

		<main id="main">{{ content }}</main>

		<footer class="site-footer">
			<div class="container site-footer__inner">
				<p>
					© {{ "now" | date: "%Y" }} Tiny Pond. Worker-owned and independent.
				</p>
				<ul class="site-footer__links">
					<li><a href="mailto:tj@tinypond.studio">tj@tinypond.studio</a></li>
					<li><a href="https://bsky.app/profile/tinypond.studio">Bluesky</a></li>
					<li><a href="https://www.instagram.com/tinypond.studio/">Instagram</a></li>
					<li><a href="https://www.tiktok.com/@tinypond_studio">TikTok</a></li>
					<li><a href="https://www.linkedin.com/company/tinypond">LinkedIn</a></li>
				</ul>
			</div>
		</footer>
	</body>
</html>
